[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]==2.13.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
aurora-api = "aurora.cli:api"
aurora-restaurar = "aurora.cli:restaurar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]
